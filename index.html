<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';">
    <!-- Report-Only policy (stricter: no 'unsafe-inline') to monitor violations before enforcing -->
    <meta http-equiv="Content-Security-Policy-Report-Only" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://report-uri.example.com; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; report-uri https://report-uri.example.com/csp-report">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Stargazers log</h1>
      <p>A log of the repositories I've starred.</p>
    </header>

    <main>
      <section id="events" aria-live="polite">
        <p class="status" role="status">Loading starred repositories...</p>
        <noscript>
          <p class="status">JavaScript is required to show starred repositories. Please enable JavaScript.</p>
        </noscript>

        <!-- Populated by script.js: use a list for semantic navigation -->
        <ul id="events-list" hidden aria-hidden="true"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
